<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4D2C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GOLÍN">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="GOLÍN: roguelite de futbolín. Jala, suelta, rebota y multiplica.">
<!-- Seguridad: solo se carga código propio, Matter.js (con verificación de integridad) y las fuentes de Google.
     "file:" permite abrir el juego con doble clic; en la web no sirve para nada a un atacante. -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; script-src 'self' file: https://cdnjs.cloudflare.com; style-src 'self' file: https://fonts.googleapis.com; font-src 'self' file: https://fonts.gstatic.com; img-src 'self' file: data: blob:; connect-src 'self'; media-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'">
<meta name="referrer" content="no-referrer">
<title>GOLÍN — prototipo v2</title>
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Permanent+Marker&family=Rubik:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/golin.css">
</head>
<body>
<div id="app">
  <aside id="debug" class="hidden"></aside>
  <main id="center">
    <header id="board"></header>
    <div id="shotbar"></div>
    <div id="stage">
      <canvas id="game"></canvas>
      <div id="tally">
        <div class="trow"><span id="tPtsLbl"></span><span class="v" id="tPts">0</span></div>
        <div class="trow"><span id="tMultLbl"></span><span class="v" id="tMult">×1</span></div>
        <div id="tMods"></div>
        <div id="tFinalRow"><small id="tFinalLbl"></small><br><span id="tFinal">0</span></div>
        <div id="tNote" class="tnote"></div>
        <div class="hintSkip" id="tSkip"></div>
      </div>
      <div id="panel" class="hidden"></div>
    </div>
    <nav id="dock"></nav>
  </main>
  <aside id="side"></aside>
</div>
<div id="sheetBack"></div>
<div id="rotate"><div class="rbox"><div class="rphone"></div><h2 id="rotTitle">Gira el celular</h2><p id="rotText">GOLÍN se juega con el celular vertical.</p></div></div>
<button id="dbgToggle" class="btn">⚙ Debug (D)</button>
<div id="tooltip" class="hidden"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"
        integrity="sha512-0z8URjGET6GWnS1xcgiLBZBzoaS8BNlKayfZyQNKz4IRp+s7CKXx0yz7Eco2+TcwoeMBa5KMwmTX7Kus7Fa5Uw=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="js/roster.js"></script>
<script src="js/config.js"></script>
<script src="js/strings.js"></script>
<script src="js/scoring.js"></script>
<script src="js/audio.js"></script>
<script src="js/economy.js"></script>
<script src="js/progress.js"></script>
<script src="js/telemetry.js"></script>
<script src="js/art.js"></script>
<script src="js/game.js"></script>
<script src="js/ui.js"></script>
<script src="js/main.js"></script>
</body>
</html>
